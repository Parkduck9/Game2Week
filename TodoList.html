<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프로젝트 대시보드</title>
<style>
  :root {
    --bg: #f6f5f2; --surface: #ffffff; --text: #1b1b1b; --muted: #6b6b6b;
    --line: #e2e0da; --accent: #3d6fb6; --done: #9a9a9a; --ok: #2f8a4c;
    --tag-bg: #f1ece2; --warn-bg: #fff6e6; --warn-line: #f0c77a; --warn-text: #8a5a00;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101010; --surface: #191919; --text: #f0f0f0; --muted: #a0a0a0;
      --line: #2e2e2e; --accent: #8fb3ff; --done: #6a6a6a; --ok: #6cc98a;
      --tag-bg: #262626; --warn-bg: #221b0f; --warn-line: #6a5420; --warn-text: #f0c77a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101010; --surface: #191919; --text: #f0f0f0; --muted: #a0a0a0;
    --line: #2e2e2e; --accent: #8fb3ff; --done: #6a6a6a; --ok: #6cc98a;
    --tag-bg: #262626; --warn-bg: #221b0f; --warn-line: #6a5420; --warn-text: #f0c77a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 "Pretendard", "Malgun Gothic", system-ui, sans-serif; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; }
  header h1 { font-size: 22px; margin: 0; letter-spacing: -0.02em; }
  header .meta { color: var(--muted); font-size: 13px; }
  header .links { margin-left: auto; display: flex; gap: 8px; }
  a { color: var(--accent); }
  .btn { font: inherit; font-size: 13px; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; cursor: pointer; text-decoration: none; }
  .progress { margin: 16px 0 20px; }
  .progress-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
  .card h2 { font-size: 14px; margin: 0 0 8px; }
  .card.warn { background: var(--warn-bg); border-color: var(--warn-line); }
  .card ul { margin: 0; padding-left: 18px; font-size: 14px; }
  .card li { margin: 2px 0; }
  .phases { display: grid; gap: 6px; }
  .phase { display: grid; grid-template-columns: minmax(0, 1fr) 90px 46px; gap: 10px; align-items: center; font-size: 13.5px; }
  .phase .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .phase .mini { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .phase .mini i { display: block; height: 100%; background: var(--accent); }
  .phase.complete .mini i { background: var(--ok); }
  .phase .n { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-top: 8px; flex-wrap: wrap; }
  .tabs button { font: inherit; font-size: 14px; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); padding: 8px 12px; cursor: pointer; }
  .tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
  .doc { background: var(--surface); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 10px 10px; padding: 8px 20px 20px; overflow-x: auto; }
  .doc h1 { font-size: 20px; } .doc h2 { font-size: 17px; margin-top: 28px; border-bottom: 1px solid var(--line); padding-bottom: 4px; } .doc h3 { font-size: 15px; margin-top: 18px; }
  .doc ul { padding-left: 22px; } .doc li { margin: 2px 0; }
  .doc li:has(> input[type=checkbox]) { list-style: none; margin-left: -22px; }
  .doc li:has(> input:checked) { color: var(--done); }
  .doc input[type=checkbox] { accent-color: var(--ok); margin-right: 6px; }
  .doc blockquote { margin: 8px 0; padding: 4px 12px; border-left: 3px solid var(--line); color: var(--muted); }
  .doc table { border-collapse: collapse; font-size: 14px; }
  .doc th, .doc td { border: 1px solid var(--line); padding: 4px 10px; text-align: left; }
  code { font-family: Consolas, "D2Coding", monospace; font-size: 13px; background: var(--tag-bg); padding: 0 4px; border-radius: 3px; }
  pre { background: var(--tag-bg); padding: 10px 12px; border-radius: 6px; overflow-x: auto; }
  pre code { background: none; padding: 0; }
  code.decide { background: var(--warn-bg); color: var(--warn-text); border: 1px solid var(--warn-line); }
  .error { background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 10px; padding: 16px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <h1>3D 턴제 전투 (독자 IP)</h1>
    <span class="meta" id="updated"></span>
    <span class="links">
      <a class="btn" href="/Plans/Service_Plan.html">서비스·배포 계획</a>
      <a class="btn" href="/Plans/MapTool_Plan.html">맵툴 계획</a>
      <a class="btn" href="/Preview/heroine_preview.html">주인공 모델 미리보기</a>
      <button class="btn" id="refresh" type="button">새로고침</button>
    </span>
  </header>

  <div id="app"></div>
</div>

<script>
const FILES = { todo: '/TODO.md', log: '/WORKLOG.md', rules: '/CLAUDE.md' };
const TABS = [['todo', '할 일 (TODO.md)'], ['log', '작업 기록 (WORKLOG.md)'], ['rules', '규칙 (CLAUDE.md)']];
let current = 'todo';
try { current = localStorage.getItem('dash-tab') || 'todo'; } catch (e) {}
let lastText = '';

const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const inline = s => marked.parseInline(s);

// "## 제목" 단위로 나누기
function sections(md) {
  const out = [];
  let cur = null;
  for (const line of md.split(/\r?\n/)) {
    const h = line.match(/^##\s+(.*)/);
    if (h) { cur = { title: h[1].trim(), lines: [] }; out.push(cur); }
    else if (cur) cur.lines.push(line);
  }
  return out;
}
const tasksOf = lines => lines.filter(l => /^\s*- \[[ x]\]/.test(l));
const isDone = l => /^\s*- \[x\]/.test(l);

function lastBlock(md, heading) {
  const idx = md.lastIndexOf(heading);
  if (idx < 0) return [];
  const rest = md.slice(idx + heading.length).split(/\r?\n/);
  const out = [];
  for (const l of rest) {
    if (/^(#{1,3}\s|---)/.test(l)) break;
    if (l.trim()) out.push(l);
  }
  return out;
}

function render(docs) {
  const secs = sections(docs.todo);
  const fixSec = secs.find(s => s.title.includes('바꿔야 할 것'));
  const work = secs.filter(s => s !== fixSec && !s.title.includes('완료 기준'));
  const all = work.flatMap(s => tasksOf(s.lines));
  const done = all.filter(isDone).length;
  const pct = all.length ? Math.round(done / all.length * 100) : 0;

  const fixOpen = fixSec ? tasksOf(fixSec.lines).filter(l => !isDone(l)) : [];
  const decide = all.filter(l => !isDone(l) && l.includes('결정 필요'));
  const next = lastBlock(docs.log, '### 다음에 할 일');

  const li = l => `<li>${inline(l.replace(/^\s*- (\[[ x]\]\s*)?/, ''))}</li>`;
  const phaseRows = work.map(s => {
    const t = tasksOf(s.lines);
    if (!t.length) return '';
    const d = t.filter(isDone).length;
    return `<div class="phase${d === t.length ? ' complete' : ''}"><span class="name">${inline(s.title)}</span><span class="mini"><i style="width:${d / t.length * 100}%"></i></span><span class="n">${d}/${t.length}</span></div>`;
  }).join('');

  document.getElementById('app').innerHTML = `
    <div class="progress">
      <div class="progress-row"><span>전체 진행</span><span>${done} / ${all.length} 완료 (${pct}%)</span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
    </div>
    <div class="grid">
      <div class="card"><h2>▶ 다음에 할 일</h2><ul>${next.map(li).join('') || '<li>—</li>'}</ul></div>
      <div class="card warn"><h2>🔧 바꿔야 할 것 (${fixOpen.length})</h2><ul>${fixOpen.map(li).join('') || '<li>없음</li>'}</ul></div>
      <div class="card warn"><h2>❓ 결정 필요 (${decide.length})</h2><ul>${decide.map(li).join('') || '<li>없음</li>'}</ul></div>
    </div>
    <div class="card"><h2>단계별 진행</h2><div class="phases">${phaseRows}</div></div>
    <div class="tabs">${TABS.map(([k, n]) => `<button data-tab="${k}" class="${k === current ? 'on' : ''}">${n}</button>`).join('')}</div>
    <div class="doc" id="doc"></div>`;

  document.getElementById('doc').innerHTML = marked.parse(docs[current]);
  document.querySelectorAll('#app code').forEach(c => { if (c.textContent.includes('결정 필요')) c.classList.add('decide'); });
  document.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => {
    current = b.dataset.tab;
    try { localStorage.setItem('dash-tab', current); } catch (e) {}
    render(docs);
  }));
}

async function load(force) {
  try {
    const entries = await Promise.all(Object.entries(FILES).map(async ([k, url]) => {
      const r = await fetch(url, { cache: 'no-store' });
      if (!r.ok) throw new Error(`${url} (${r.status})`);
      return [k, await r.text()];
    }));
    const docs = Object.fromEntries(entries);
    const text = JSON.stringify(docs);
    if (force || text !== lastText) {
      lastText = text;
      const y = scrollY;
      render(docs);
      scrollTo(0, y);
    }
    document.getElementById('updated').textContent = '마지막 확인 ' + new Date().toLocaleTimeString('ko-KR');
  } catch (e) {
    document.getElementById('app').innerHTML = `<div class="error" style="margin-top:16px"><b>MD 파일을 읽지 못했어요.</b><br>
      이 대시보드는 로컬 서버로 열어야 해요: PowerShell에서 <code>powershell -ExecutionPolicy Bypass -File Tools/serve.ps1</code> 실행 후
      <a href="http://localhost:8790/">http://localhost:8790/</a> 접속.<br><span style="color:var(--muted);font-size:13px">${esc(String(e.message || e))}</span></div>`;
  }
}

document.getElementById('refresh').addEventListener('click', () => load(true));
load(true);
setInterval(() => load(false), 5000);
</script>
</body>
</html>
