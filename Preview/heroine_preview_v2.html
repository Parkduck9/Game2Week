<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주인공 모델 미리보기</title>
<style>
  :root {
    --bg: #eceae6; --panel: #ffffff; --text: #1d1d1d; --muted: #6a6a6a;
    --line: #dcd9d3; --accent: #3d6fb6; --btn: #f4f2ee;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151515; --panel: #1e1e1e; --text: #eeeeee; --muted: #9a9a9a;
      --line: #333333; --accent: #8fb3ff; --btn: #2a2a2a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151515; --panel: #1e1e1e; --text: #eeeeee; --muted: #9a9a9a;
    --line: #333333; --accent: #8fb3ff; --btn: #2a2a2a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.5 "Pretendard", "Malgun Gothic", system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  header { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; }
  header span { color: var(--muted); font-size: 13px; }
  main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 12px; padding: 12px 16px; min-height: 0; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .panel h2 { font-size: 13px; margin: 0; padding: 8px 12px; border-bottom: 1px solid var(--line); color: var(--muted); font-weight: 600; }
  .ref { flex: 1; display: flex; align-items: center; justify-content: center; padding: 8px; min-height: 0; }
  .ref img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; }
  #view { flex: 1; position: relative; min-height: 360px; }
  #view canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px; border-top: 1px solid var(--line); align-items: center; }
  button { font: inherit; font-size: 13px; background: var(--btn); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button.on { border-color: var(--accent); color: var(--accent); }
  .stat { margin-left: auto; color: var(--muted); font-size: 12px; }
  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; }
    .ref { max-height: 40vh; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/build/three.module.js",
  "three/addons/": "./vendor/three/examples/jsm/"
} }
</script>
</head>
<body>
<header>
  <h1>주인공 (가칭) — 로우폴리 모델 v2</h1>
  <span>2.5등신 · 양갈래 노란 머리 · 노란 눈 · 후드티 + 청바지 · 리깅 · 오른손 쳐내기 · 동작 10종</span>
</header>
<main>
  <section class="panel">
    <h2>레퍼런스 (Codex 생성 3면도)</h2>
    <div class="ref"><img src="../Reference/heroine_turnaround.png" alt="주인공 3면도 레퍼런스: 정면, 측면, 후면"></div>
  </section>
  <section class="panel">
    <h2>3D 모델 — 드래그로 회전, 휠로 확대</h2>
    <div id="view"></div>
    <div class="bar">
      <button data-view="front" class="on">정면</button>
      <button data-view="side">측면</button>
      <button data-view="back">후면</button>
      <button data-view="three">3/4</button>
      <button id="wire">와이어프레임</button>
      <button id="spin">자동 회전</button>
      <select id="motion" aria-label="동작 선택"></select><button id="export">GLB 내보내기</button>
      <span class="stat" id="stat"></span>
    </div>
  </section>
</main>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

import { createHeroine } from './heroine_model_v2.js';
const {character,clips,bones,triangleCount}=createHeroine();
const materials={};character.traverse(m=>{if(m.isMesh)materials[m.material.name]=m.material;});
const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
view.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.add(character);
scene.add(new THREE.HemisphereLight(0xffffff, 0xe2d9cf, 2.1));
const key = new THREE.DirectionalLight(0xffffff, 1.5);
key.position.set(1.2, 2.5, 2.2);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
Object.assign(key.shadow.camera, { left: -0.8, right: 0.8, top: 1.4, bottom: -0.2, near: 0.1, far: 6 });
scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 0.6);
rim.position.set(-1.5, 1.5, -2);
scene.add(rim);
const ground = new THREE.Mesh(new THREE.CircleGeometry(0.6, 32).rotateX(-Math.PI / 2), new THREE.ShadowMaterial({ opacity: 0.18 }));
ground.receiveShadow = true;
scene.add(ground);

const camera = new THREE.PerspectiveCamera(28, 1, 0.05, 20);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.5, 0);
controls.enableDamping = true;
controls.autoRotateSpeed = 2.5;

const DIST = 2.6;
const VIEWS = {
  front: V(0, 0.5, DIST), side: V(DIST, 0.5, 0), back: V(0, 0.5, -DIST),
  three: V(DIST * 0.7, 0.75, DIST * 0.7),
};
function setView(name) {
  camera.position.copy(VIEWS[name]);
  controls.target.set(0, 0.5, 0);
  controls.update();
  document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === name));
}
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
setView('front');

document.getElementById('wire').addEventListener('click', e => {
  const on = e.currentTarget.classList.toggle('on');
  Object.values(materials).forEach(m => { m.wireframe = on; });
});
document.getElementById('spin').addEventListener('click', e => {
  controls.autoRotate = e.currentTarget.classList.toggle('on');
});
const GLB_NAME = 'heroine_v2.glb';
const exportGlb = () => new Promise((resolve, reject) => new GLTFExporter().parse(character, resolve, reject, { binary: true, animations:clips }));
// 로컬 서버(Tools/serve.ps1)로 열었으면 Exports/에 바로 저장, 아니면 브라우저 다운로드
document.getElementById('export').addEventListener('click', async () => {
  try {
    const glb = await exportGlb();
    if (location.protocol.startsWith('http')) {
      const r = await fetch(`/save?name=${GLB_NAME}`, { method: 'POST', body: glb });
      if (!r.ok) throw new Error(`서버 저장 실패 (${r.status})`);
      alert(`Exports/${GLB_NAME} 에 저장했어요.`);
    } else {
      const url = URL.createObjectURL(new Blob([glb], { type: 'model/gltf-binary' }));
      Object.assign(document.createElement('a'), { href: url, download: GLB_NAME }).click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
  } catch (err) {
    alert('내보내기 실패: ' + err.message);
  }
});
document.getElementById('stat').textContent = `삼각형 ${triangleCount.toLocaleString()}개 · 파츠 ${character.getObjectsByProperty('isMesh', true).length}개`;

function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(view);
resize();

const mixer=new THREE.AnimationMixer(character);const clock=new THREE.Clock();
const motion=document.getElementById('motion');const names=['대기','달리기','회피','점프','착지','쳐내기 왼쪽에서','쳐내기 오른쪽에서','정지 자세','피격','쓰러짐'];
clips.forEach((c,i)=>motion.add(new Option(names[i],c.name)));
function play(){mixer.stopAllAction();mixer.clipAction(clips.find(c=>c.name===motion.value)).play();}
motion.addEventListener('change',play);play();
renderer.setAnimationLoop(() => {mixer.update(Math.min(.05,clock.getDelta()));
  controls.update();
  renderer.render(scene, camera);
});
// 디버그용: 콘솔에서 카메라 조작
window.__heroine = { character, setView, camera, controls, exportGlb, mixer, clips };
</script>
</body>
</html>
